name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bore for integration tests
        run: |
          curl -sSL https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xz -C /usr/local/bin bore
          bore --version
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --locked
      - name: GUI checks (compile + headless backend tests)
        run: |
          python3 -m py_compile gui/localfly_backend.py gui/sni.py gui/localfly_gui.py gui/tests/test_backend.py
          python3 -m unittest discover -s gui/tests -p "test_*.py"
