name: Release (Linux)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install bore for integration tests
        run: |
          curl -sSL https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xz -C /usr/local/bin bore
          bore --version
      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build release
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        run: |
          PKG="localfly-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$PKG"
          cp "target/${{ matrix.target }}/release/localfly" "$PKG/"
          cp localfly.service com.localfly.Localfly.desktop README.md LICENSE "$PKG/"
          tar -czf "$PKG.tar.gz" "$PKG"
          echo "PKG=$PKG.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: ${{ env.PKG }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
