name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Localfly version
      placeholder: "0.1.0 (from localfly --version)"
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Linux distro and version
      placeholder: "Arch / Ubuntu 24.04"
  - type: dropdown
    id: relay
    attributes:
      label: Relay
      options: [bore.pub, Self-hosted bore server]
